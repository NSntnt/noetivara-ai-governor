name: Noetivara World Assembly Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "10 * * * *"

permissions: {}

concurrency:
  group: noetivara-world-assembly-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run World Assembly Monitor
        env:
          NS_AUTLOGIN: ${{ secrets.NS_AUTLOGIN }}
          NS_NATION: ${{ secrets.NS_NATION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/world_assembly_monitor.py
