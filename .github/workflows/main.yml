name: Noetivara AI Governor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

# 同じ国家について複数のWorkflowが同時に動かないようにする
concurrency:
  group: noetivara-governor
  cancel-in-progress: false

jobs:
  govern:
    runs-on: ubuntu-latest

    steps:
      - name: Run Noetivara AI Governor
        env:
          NS_AUTLOGIN: ${{ secrets.NS_AUTLOGIN }}
          NS_NATION: ${{ secrets.NS_NATION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          # ==========================================================
          # 設定
          # ==========================================================

          NATION = os.environ["NS_NATION"].strip()
          NS_AUTLOGIN = os.environ["NS_AUTLOGIN"].strip()
          GROQ_API_KEY = os.environ["GROQ_API_KEY"].strip()

          USER_AGENT = (
              "Noetivara-AI-Governor/1.0 "
              "(personal NationStates automation project)"
          )

          NS_API = "https://www.nationstates.net/cgi-bin/api.cgi"
          GROQ_API = "https://api.groq.com/openai/v1/chat/completions"

          # この値未満なら安全のため回答しない
          MIN_CONFIDENCE = 0.70

          # ==========================================================
          # 1. NationStatesへ認証してIssue取得
          # ==========================================================

          print("========================================")
          print("Noetivara AI Governor")
          print("========================================")
          print()
          print("NationStatesへ接続しています...")

          issue_params = urllib.parse.urlencode({
              "nation": NATION,
              "q": "issues",
          })

          issue_url = f"{NS_API}?{issue_params}"

          issue_request = urllib.request.Request(
              issue_url,
              headers={
                  "User-Agent": USER_AGENT,
                  "X-Autologin": NS_AUTologin,
              },
          )

          try:
              with urllib.request.urlopen(
                  issue_request,
                  timeout=60
              ) as response:

                  xml_text = response.read().decode("utf-8")

                  # 最初の認証で返されたPINを取得
                  NS_PIN = response.headers.get("X-Pin")

          except urllib.error.HTTPError as e:
              print(f"NationStates API Error: HTTP {e.code}")
              print(
                  e.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )
              sys.exit(1)

          except Exception as e:
              print(f"NationStates接続エラー: {e}")
              sys.exit(1)

          if not NS_PIN:
              print("X-Pinを取得できませんでした。")
              print("今回は安全のため処理を中止します。")
              sys.exit(1)

          print("NationStates認証成功。")
          print("X-Pin取得成功。")

          # ==========================================================
          # 2. XML解析
          # ==========================================================

          try:
              root = ET.fromstring(xml_text)
          except ET.ParseError as e:
              print(f"XML解析エラー: {e}")
              sys.exit(1)

          issues = []

          for issue in root.findall(".//ISSUE"):

              issue_id = issue.attrib.get("id")
              title = (issue.findtext("TITLE") or "").strip()
              text = (issue.findtext("TEXT") or "").strip()

              options = []

              for option in issue.findall("OPTION"):

                  option_id = option.attrib.get("id")
                  option_text = (option.text or "").strip()

                  if option_id is not None:
                      options.append({
                          "id": str(option_id),
                          "text": option_text,
                      })

              warnings = []

              for warning in issue.findall(".//WARNING"):

                  warning_text = (warning.text or "").strip()

                  if warning_text:
                      warnings.append(warning_text)

              if issue_id and title and text and options:

                  issues.append({
                      "id": str(issue_id),
                      "title": title,
                      "text": text,
                      "options": options,
                      "warnings": warnings,
                  })

          print(f"現在のIssue数: {len(issues)}")

          # ==========================================================
          # 3. Issueがなければ終了
          # ==========================================================

          if not issues:
              print("回答可能なIssueはありません。")
              print("今回の実行を終了します。")
              sys.exit(0)

          # ==========================================================
          # 4. 1回の実行では1件だけ処理
          # ==========================================================

          issue = issues[0]

          print()
          print("=" * 80)
          print(f"Issue {issue['id']}: {issue['title']}")
          print("=" * 80)

          valid_choices = [
              option["id"]
              for option in issue["options"]
          ]

          options_text = "\n".join(
              f'[{option["id"]}] {option["text"]}'
              for option in issue["options"]
          )

          warning_text = "\n".join(
              f"- {warning}"
              for warning in issue["warnings"]
          )

          if not warning_text:
              warning_text = "なし"

          # ==========================================================
          # 5. GPT-OSS 20Bへ判断依頼
          # ==========================================================

          system_prompt = """
          あなたはNationStates国家「Noetivara」の政策決定AIです。

          【最重要ルール】

          1. 与えられたIssue本文・WARNING・選択肢だけを根拠にする。
          2. 入力に存在しない事実を作らない。
          3. 入力に存在しない国・人物・組織・事件を作らない。
          4. Noetivaraを他国と混同しない。
          5. 必ず提示された選択肢から1つだけ選ぶ。
          6. 選択肢IDを変更しない。
          7. WARNINGを必ず考慮する。
          8. 判断理由は簡潔かつ具体的にする。
          9. NationStatesのゲーム内効果を知らない場合、数値や効果を捏造しない。
          10. 自信がない場合はconfidenceを低くする。

          【Noetivaraの基本理念】

          「Intelligence Guides the Future.」

          【国家の優先順位】

          1. 知性・科学・教育
          2. 個人の権利と自由
          3. 長期的な社会の安定
          4. 合理的で持続可能な経済
          5. 倫理性
          6. 環境
          7. 外交・安全保障

          【政策方針】

          - 科学技術と教育を積極的に推進する。
          - 個人の権利を尊重する。
          - 長期的利益を短期的利益より重視する。
          - 社会の安定を維持する。
          - 経済は効率・生産性・持続性を重視する。
          - 暴力や重大な権利侵害には厳格に対応する。
          - 外交は原則として平和的・協調的に行う。
          """

          user_prompt = f"""
          次のNationStates Issueについて、
          Noetivaraとして最も適切な政策を選んでください。

          Issue ID:
          {issue["id"]}

          タイトル:
          {issue["title"]}

          本文:
          {issue["text"]}

          選択肢:
          {options_text}

          WARNING:
          {warning_text}
          """

          schema = {
              "type": "json_schema",
              "json_schema": {
                  "name": "noetivara_issue_decision",
                  "strict": True,
                  "schema": {
                      "type": "object",
                      "properties": {
                          "choice": {
                              "type": "string",
                              "enum": valid_choices,
                          },
                          "confidence": {
                              "type": "number",
                              "minimum": 0,
                              "maximum": 1,
                          },
                          "reason": {
                              "type": "string",
                          },
                      },
                      "required": [
                          "choice",
                          "confidence",
                          "reason"
                      ],
                      "additionalProperties": False,
                  },
              },
          }

          payload = {
              "model": "openai/gpt-oss-20b",
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt,
                  },
                  {
                      "role": "user",
                      "content": user_prompt,
                  },
              ],
              "reasoning_effort": "low",
              "include_reasoning": False,
              "temperature": 0,
              "max_completion_tokens": 500,
              "response_format": schema,
          }

          request_data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          groq_request = urllib.request.Request(
              GROQ_API,
              data=request_data,
              headers={
                  "Authorization":
                      f"Bearer {GROQ_API_KEY}",
                  "Content-Type":
                      "application/json",
                  "User-Agent":
                      USER_AGENT,
              },
              method="POST",
          )

          print()
          print("AIが政策判断を行っています...")

          try:
              with urllib.request.urlopen(
                  groq_request,
                  timeout=120
              ) as response:

                  groq_result = json.loads(
                      response.read().decode("utf-8")
                  )

          except urllib.error.HTTPError as e:
              print(f"Groq API Error: HTTP {e.code}")
              print(
                  e.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )
              sys.exit(1)

          except Exception as e:
              print(f"Groq接続エラー: {e}")
              sys.exit(1)

          # ==========================================================
          # 6. AI結果解析
          # ==========================================================

          try:
              content = (
                  groq_result["choices"][0]
                  ["message"]["content"]
              )

              decision = json.loads(content)

              choice = str(
                  decision["choice"]
              )

              confidence = float(
                  decision["confidence"]
              )

              reason = str(
                  decision["reason"]
              )

          except Exception as e:
              print(f"AI結果の解析に失敗しました: {e}")
              sys.exit(1)

          print()
          print("--- AI判断 ---")
          print(f"選択肢: {choice}")
          print(f"確信度: {confidence:.2f}")
          print(f"理由: {reason}")
          print()

          # ==========================================================
          # 7. 安全検証
          # ==========================================================

          if choice not in valid_choices:

              print(
                  f"ERROR: 選択肢 {choice} は存在しません。"
              )

              print(
                  "NationStatesへの回答は実行しません。"
              )

              sys.exit(1)

          if not 0 <= confidence <= 1:

              print(
                  f"ERROR: 確信度 {confidence} が不正です。"
              )

              print(
                  "NationStatesへの回答は実行しません。"
              )

              sys.exit(1)

          if confidence < MIN_CONFIDENCE:

              print(
                  f"確信度 {confidence:.2f} が"
                  f"基準値 {MIN_CONFIDENCE:.2f} 未満です。"
              )

              print(
                  "安全のため、このIssueは保留します。"
              )

              sys.exit(0)

          # ==========================================================
          # 8. NationStatesへ回答
          # ==========================================================

          print(
              f"Issue {issue['id']} に"
              f"選択肢 {choice} を送信します..."
          )

          answer_data = urllib.parse.urlencode({
              "nation": NATION,
              "c": "issue",
              "issue": issue["id"],
              "option": choice,
          }).encode("utf-8")

          answer_request = urllib.request.Request(
              NS_API,
              data=answer_data,
              headers={
                  "User-Agent": USER_AGENT,
                  "X-Pin": NS_PIN,
                  "Content-Type":
                      "application/x-www-form-urlencoded",
              },
              method="POST",
          )

          try:

              with urllib.request.urlopen(
                  answer_request,
                  timeout=60
              ) as response:

                  answer_result = (
                      response.read()
                      .decode("utf-8")
                  )

          except urllib.error.HTTPError as e:

              print(
                  f"NationStates回答エラー: HTTP {e.code}"
              )

              print(
                  e.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              sys.exit(1)

          except Exception as e:

              print(
                  f"NationStates回答エラー: {e}"
              )

              sys.exit(1)

          # ==========================================================
          # 9. 結果
          # ==========================================================

          print()
          print("=" * 80)
          print("NationStatesへの回答結果")
          print("=" * 80)
          print(answer_result)
          print("=" * 80)
          print()
          print(
              f"Issue {issue['id']} の自動回答が完了しました。"
          )
          print(
              "次回のWorkflow実行では、残っているIssueを処理します。"
          )
          PY
