name: Noetivara AI Governor

on:
  workflow_dispatch:

jobs:
  govern:
    runs-on: ubuntu-latest

    steps:
      - name: Run Noetivara governor
        env:
          NS_AUTLOGIN: ${{ secrets.NS_AUTLOGIN }}
          NS_NATION: ${{ secrets.NS_NATION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          NATION = os.environ["NS_NATION"].strip()
          NS_AUTLOGIN = os.environ["NS_AUTLOGIN"].strip()
          GROQ_API_KEY = os.environ["GROQ_API_KEY"].strip()

          USER_AGENT = (
              "Noetivara-AI-Governor/1.0 "
              "(personal NationStates automation project)"
          )

          GROQ_URL = "https://api.groq.com/openai/v1/chat/completions"
          MIN_CONFIDENCE = 0.70

          # ==========================================================
          # NationStates APIへ最初の認証付きリクエスト
          # ==========================================================

          print("NoetivaraのIssueを取得しています...")

          ns_params = urllib.parse.urlencode({
              "nation": NATION,
              "q": "issues",
          })

          ns_url = (
              "https://www.nationstates.net/cgi-bin/api.cgi?"
              + ns_params
          )

          ns_request = urllib.request.Request(
              ns_url,
              headers={
                  "User-Agent": USER_AGENT,
                  "X-Autologin": NS_AUTLOGIN,
              },
          )

          try:
              with urllib.request.urlopen(
                  ns_request,
                  timeout=60
              ) as response:

                  xml_text = response.read().decode("utf-8")

                  # ★ 最初の認証で取得したX-Pinを保存
                  NS_PIN = response.headers.get("X-Pin")

          except urllib.error.HTTPError as e:
              print(f"NationStates API Error: HTTP {e.code}")
              print(
                  e.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )
              sys.exit(1)

          except Exception as e:
              print(f"NationStates API Error: {e}")
              sys.exit(1)

          if not NS_PIN:
              print("X-Pinを取得できませんでした。")
              print("認証処理を中止します。")
              sys.exit(1)

          print("NationStates認証成功。X-Pinを取得しました。")

          # ==========================================================
          # XML解析
          # ==========================================================

          try:
              root = ET.fromstring(xml_text)
          except ET.ParseError as e:
              print(f"XML解析エラー: {e}")
              sys.exit(1)

          issues = []

          for issue in root.findall(".//ISSUE"):

              issue_id = issue.attrib.get("id")
              title = (issue.findtext("TITLE") or "").strip()
              text = (issue.findtext("TEXT") or "").strip()

              options = []

              for option in issue.findall("OPTION"):

                  option_id = option.attrib.get("id")
                  option_text = (option.text or "").strip()

                  if option_id is not None:
                      options.append({
                          "id": str(option_id),
                          "text": option_text,
                      })

              warnings = []

              for warning in issue.findall(".//WARNING"):
                  warning_text = (
                      (warning.text or "").strip()
                  )

                  if warning_text:
                      warnings.append(warning_text)

              if issue_id and title and text and options:

                  issues.append({
                      "id": str(issue_id),
                      "title": title,
                      "text": text,
                      "options": options,
                      "warnings": warnings,
                  })

          print(f"取得したIssue数: {len(issues)}")

          if not issues:
              print("現在、回答可能なIssueはありません。")
              sys.exit(0)

          # ==========================================================
          # 今回は最初の1件だけ
          # ==========================================================

          issue = issues[0]

          print()
          print("=" * 80)
          print(f"Issue {issue['id']}: {issue['title']}")
          print("=" * 80)

          options_text = "\n".join(
              f'[{o["id"]}] {o["text"]}'
              for o in issue["options"]
          )

          warning_text = "\n".join(
              f"- {w}"
              for w in issue["warnings"]
          )

          if not warning_text:
              warning_text = "なし"

          # ==========================================================
          # Groq
          # ==========================================================

          system_prompt = """
          あなたはNationStates国家「Noetivara」の政策決定AIです。

          【絶対ルール】
          - 与えられたIssueと選択肢を正確に読む。
          - 選択肢IDは提示されたものから1つだけ選ぶ。
          - 入力に存在しない国家、人名、組織、事件を作らない。
          - Noetivaraを別の国と混同しない。
          - 不明な事実を断定しない。
          - 国家方針を優先する。
          - WARNINGがある場合は考慮する。

          【Noetivaraの国家方針】
          優先順位:
          1. 知性・科学・教育
          2. 個人の権利と自由
          3. 長期的な社会の安定
          4. 合理的で持続可能な経済
          5. 倫理性
          6. 環境
          7. 外交・安全保障

          国家理念:
          「自由を尊重し、科学と知性を信頼し、
          長期的に国家全体の利益が最大になる政策を選ぶ。」
          """

          user_prompt = f"""
          以下のIssueについて、Noetivaraとしての政策判断を行ってください。

          Issue ID:
          {issue["id"]}

          タイトル:
          {issue["title"]}

          本文:
          {issue["text"]}

          選択肢:
          {options_text}

          WARNING:
          {warning_text}
          """

          valid_ids = [
              o["id"]
              for o in issue["options"]
          ]

          schema = {
              "type": "json_schema",
              "json_schema": {
                  "name": "noetivara_issue_decision",
                  "strict": True,
                  "schema": {
                      "type": "object",
                      "properties": {
                          "choice": {
                              "type": "string",
                              "enum": valid_ids,
                          },
                          "confidence": {
                              "type": "number",
                              "minimum": 0,
                              "maximum": 1,
                          },
                          "reason": {
                              "type": "string",
                          },
                      },
                      "required": [
                          "choice",
                          "confidence",
                          "reason"
                      ],
                      "additionalProperties": False,
                  },
              },
          }

          payload = {
              "model": "openai/gpt-oss-20b",
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt,
                  },
                  {
                      "role": "user",
                      "content": user_prompt,
                  },
              ],
              "reasoning_effort": "low",
              "include_reasoning": False,
              "temperature": 0,
              "max_completion_tokens": 500,
              "response_format": schema,
          }

          request_data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          groq_request = urllib.request.Request(
              GROQ_URL,
              data=request_data,
              headers={
                  "Authorization":
                      f"Bearer {GROQ_API_KEY}",
                  "Content-Type":
                      "application/json",
                  "User-Agent":
                      USER_AGENT,
              },
              method="POST",
          )

          print("AIが政策判断を行っています...")

          try:
              with urllib.request.urlopen(
                  groq_request,
                  timeout=120
              ) as response:

                  groq_result = json.loads(
                      response.read().decode("utf-8")
                  )

          except urllib.error.HTTPError as e:
              print(f"Groq API Error: HTTP {e.code}")
              print(
                  e.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )
              sys.exit(1)

          except Exception as e:
              print(f"Groq API Error: {e}")
              sys.exit(1)

          # ==========================================================
          # AI結果
          # ==========================================================

          try:
              content = (
                  groq_result["choices"][0]
                  ["message"]["content"]
              )

              decision = json.loads(content)

              choice = str(
                  decision["choice"]
              )

              confidence = float(
                  decision["confidence"]
              )

              reason = str(
                  decision["reason"]
              )

          except Exception as e:
              print(f"AI結果の解析に失敗しました: {e}")
              sys.exit(1)

          print()
          print("--- AI判断 ---")
          print(f"選択肢: {choice}")
          print(f"確信度: {confidence:.2f}")
          print(f"理由: {reason}")
          print()

          # ==========================================================
          # 安全チェック
          # ==========================================================

          if choice not in valid_ids:
              print("存在しない選択肢なので中止します。")
              sys.exit(1)

          if confidence < MIN_CONFIDENCE:
              print(
                  f"確信度が{MIN_CONFIDENCE:.2f}未満なので保留します。"
              )
              sys.exit(0)

          # ==========================================================
          # ★ 重要：ここではX-Pinを使う
          # ==========================================================

          print("安全検証を通過しました。")
          print(
              f"Issue {issue['id']} に"
              f"選択肢 {choice} を送信します..."
          )

          answer_data = urllib.parse.urlencode({
              "nation": NATION,
              "c": "issue",
              "issue": issue["id"],
              "option": choice,
          }).encode("utf-8")

          answer_request = urllib.request.Request(
              "https://www.nationstates.net/cgi-bin/api.cgi",
              data=answer_data,
              headers={
                  "User-Agent": USER_AGENT,
                  "X-Pin": NS_PIN,
                  "Content-Type":
                      "application/x-www-form-urlencoded",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(
                  answer_request,
                  timeout=60
              ) as response:

                  answer_result = (
                      response.read()
                      .decode("utf-8")
                  )

          except urllib.error.HTTPError as e:
              print(
                  f"NationStates回答エラー: HTTP {e.code}"
              )
              print(
                  e.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )
              sys.exit(1)

          except Exception as e:
              print(
                  f"NationStates回答エラー: {e}"
              )
              sys.exit(1)

          print()
          print("=" * 80)
          print("NationStatesへの回答結果")
          print("=" * 80)
          print(answer_result)
          print("=" * 80)
          print("Issueの自動回答が完了しました。")
          PY
