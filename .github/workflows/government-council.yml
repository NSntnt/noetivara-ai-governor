name: Noetivara Government Council

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3,9,15,21 * * *"

permissions: {}

concurrency:
  group: noetivara-government-council
  cancel-in-progress: false

jobs:
  council:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Government Council
        env:
          NS_AUTLOGIN: ${{ secrets.NS_AUTLOGIN }}
          NS_NATION: ${{ secrets.NS_NATION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/government_council.py
